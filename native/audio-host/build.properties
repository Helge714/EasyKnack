# Shared native build policy; shipped inside the plugin SDK.
cpp.standard=17
host.compile.flags=-O2 -static
plugin.compile.flags=-O3 -ffp-contract=off
plugin.link.flags=-static
windows.libraries=ws2_32 ole32 uuid winmm advapi32 user32

# Platform-specific host/plugin link policy. CMake and Java share these keys.
linux.host.compile.flags=-O2 -pthread
linux.plugin.link.flags=-pthread
linux.libraries=dl pthread m
macos.host.compile.flags=-O2 -pthread
macos.plugin.link.flags=-pthread
macos.libraries=pthread
macos.frameworks=CoreFoundation CoreAudio AudioToolbox
