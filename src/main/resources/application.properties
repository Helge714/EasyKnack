text.2f72b38e2e5bd3fc=Quantizes positive Hz to the nearest allowed equal-tempered note, measured in semitones. Ties choose the lower note. Invalid/zero input returns zero in Scale mode. Use Pitch Hold before this node for unreliable detection.
