envelope.hold.tooltip=Hold Sustain while Gate is positive. Disabled: proceed directly to Release after Attack/Decay.
triggerdivider.trigger.tooltip=Passes every Nth trigger at its original sample position. Division 2 passes triggers 2, 4, 6, ... Unconnected: click to count a trigger.
triggerdivider.reset.tooltip=Resets the counter without emitting a trigger. A simultaneous input trigger counts as the first trigger after reset.
triggercounter.index.tooltip=First trigger: index 0, then 1, 2, ... Held between triggers; updated at the same sample as the output trigger. Without Wrap, saturates at 16777215 (exact float integers).
triggercounter.reset.tooltip=Resets Index to 0 without emitting a trigger. The next trigger has index 0. Reset is applied before a simultaneous trigger.
triggercounter.count.tooltip=With Wrap enabled, repeats indices 0 to Count minus 1. Ignored while Wrap is disabled.
triggerfilter.condition.tooltip=Passes a trigger only when Condition is finite and greater than 0 at that exact sample. Zero and negative values discard the trigger. Use Audio rate for sample-accurate index comparisons.
triggerpulse.tooltip=Converts each trigger to a one-sample pulse of 1. Simultaneous triggers in the same stream form one pulse; all other samples are zero.
rate.trigger.tooltip=Trigger: at most one trigger per sample and stream, separately per voice. MIDI ports carry complete MIDI messages.
triggerdelay.time.tooltip=Delay from 1 sample to 10 seconds, rounded to whole samples. Time is sampled once per block; each arriving trigger keeps its scheduled due time. In feedback, Time must come from outside the loop.
triggerdelay.reset.tooltip=Deletes pending triggers, including triggers due at this sample. A simultaneous new input schedules a new trigger. Reset must come from outside the feedback loop.
triggermerge.tooltip=Combines 2 to 16 trigger streams. Simultaneous triggers produce one output trigger. Works inside Trigger Delay feedback loops.
triggertimer.elapsed.tooltip=Time since the last trigger, in the selected unit. Zero until the first trigger, then increases sample by sample. Each trigger resets it to zero. Never smoothed.
triggertimer.interval.tooltip=Time between the last two triggers, optionally smoothed, in the selected unit. Zero until the second trigger. Held until the next trigger; the first measured interval is adopted immediately.
triggertimer.smoothing.tooltip=Sampled at each trigger. 0: use the new interval directly. 0.9: 90% previous interval plus 10% new interval. 1: hold the measured interval. The first complete interval is always adopted directly.

text.98eed99daa852be8=Normalize power

text.ee9889f28a7c0ee3=Gaussian

text.512fd3c6042cd1d9=Box

text.8a716159a6854658=Kernel

text.e906b70fad6e47e1=Kernel radius in bins. Zero is an exact bypass. Gaussian uses a radius of three standard deviations. Destination phases are retained; phase randomization is a separate operation.

text.e8260b6010484eec=Rescale each frame to preserve total spectral power. This is not a perceived loudness normalization. Without it, Maximum preserves neighbourhood peaks; Box and Gaussian average magnitudes.

text.a6ed9ed152cdcbf4=Kernel radius in bins. Zero is an exact bypass. Gaussian uses a radius of three standard deviations. Preserve phase selects magnitude-only processing.

text.1237e268115650a5=Off: advance each bin's phase continuously at its bin frequency for IFFT synthesis. On: retain input phases for magnitude-only processing; newly filled bins may cancel during overlap-add. Zero width always preserves the complete input.

text.f10c62555230508b=Preserve phase

text.25dfadc00885f419=Preserve

text.c5af3d2bf8edf1fd=Noise fills frequency regions using a continuous noise source. Continuous produces bin-centred tones. Preserve changes magnitudes only and may cancel during IFFT overlap. Zero width is always an exact bypass.

text.0be53b37180f2dc7=Kernel radius in bins. Zero is an exact bypass. Gaussian uses a radius of three standard deviations. Synthesis selects noise, tones or magnitude-only processing.

text.04f13cecbc50590b=Continuous

text.7de5a138fd9bbeda=Synthesis

text.04bdfa9bf8a69a22=Preserve total spectral power; in Noise mode this is an expected value, not a per-frame noise limiter. Not a perceived loudness normalization.

text.fe574b9cb60aa36c=Smooths short loudness fluctuations after overlap-add. 0 is unchanged; 1 applies full bounded RMS correction (10 ms / 500 ms). May soften intentional dynamics and slightly broaden the spectrum. Adds no latency.

text.1e42d0c86af7a9c6=Stability

text.27b0a304e7c8ce54=Captures the next complete FFT frame, separately for each bin and channel. Before capture, values pass through. Holding magnitude alone keeps the incoming phase; it is not an independent spectral freeze.

text.54460556c5cd94ee=Frame Trigger

text.3f90835b38c2299f=Bin Sample & Hold

text.3338880eef09adda=A spectral group needs one Spectrum input, at most one Spectrum output and seven audio Combine outputs, and up to 16 numeric or trigger frame inputs.

text.c1c1009d3f37ec05=Update

text.b068477b4ffc365b=Level compensation

text.799c7d78c63efb6d=Higher orders give steeper slopes using cascaded second-order sections. Resonance is distributed across the sections. Order 2 preserves the original filter.

text.9754f12bccfa20be=Matches smoothed output RMS to input RMS with gain limited to 0.25-4. Not loudness normalization or a limiter; cannot restore removed frequencies. Adds no latency.

text.623efd3744860446=Bin Smoothing

text.1ca99a991188e227=New-value fraction per FFT frame: 0 holds, 1 replaces. The first frame initializes each bin. Smaller hops update more often. Audio inputs use the value at the window end.

