easyknack.routing.stepswitch.title=Step Switch
easyknack.routing.stepswitch.steps=Steps
easyknack.routing.stepswitch.next=Next
easyknack.routing.stepswitch.reset=Reset
easyknack.routing.stepswitch.value=Value
easyknack.routing.stepswitch.index=Index
easyknack.routing.stepswitch.input=Input
easyknack.routing.stepswitch.index.tooltip=Active step index, starting at 0. Follows the output rate.
easyknack.routing.stepswitch.steps.tooltip=Number of inputs, 1–32. Removing the active step returns to the first input. Undo restores removed connections.
easyknack.routing.stepswitch.next.tooltip=Each trigger advances one step and wraps at the end. Unconnected: click to advance at the next block.
easyknack.routing.stepswitch.reset.tooltip=Select the first input. Reset wins over Next at the same sample.
easyknack.routing.stepswitch.rate.tooltip=Auto uses AudioRate when a trigger or audio input is connected, otherwise ControlRate. ControlRate samples at block start and defers later triggers to the next block. Audio switching is immediate and can click.
easyknack.routing.stepswitch.select.tooltip=Select this step at the next audio block.

