easyknack.routing.stepswitch.reset.tooltip=Select the first input. Reset wins over Next at the same sample.
easyknack.routing.stepswitch.rate.tooltip=Auto uses AudioRate when a trigger or audio input is connected, otherwise ControlRate. ControlRate samples at block start and defers later triggers to the next block. Audio switching is immediate and can click.
easyknack.routing.stepswitch.select.tooltip=Select this step at the next audio block.

