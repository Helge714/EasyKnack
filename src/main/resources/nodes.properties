# Direct audio level measurement
easyknack.analysis.level.title=Level Analysis
easyknack.analysis.level.peak=Peak
easyknack.analysis.level.rms=RMS
easyknack.analysis.level.audio-in=Audio In
easyknack.analysis.level.channel=Channel
easyknack.analysis.level.window=RMS window
easyknack.analysis.level.smooth=Smoothing
easyknack.analysis.level.attack=Attack
easyknack.analysis.level.release=Release
easyknack.analysis.level.peak.tooltip=Absolute peak of the current block. Linear amplitude: 0 = silence, 1 = full scale; values above 1 are allowed. Optional smoothing follows the block peaks.
easyknack.analysis.level.rms.tooltip=Root mean square over the trailing window. Linear amplitude, updated once per block. A full-scale sine has RMS about 0.707. No frequency weighting.
easyknack.analysis.level.audio-in.tooltip=Polyphonic voices are summed before measuring. Unconnected input is silence.
easyknack.analysis.level.channel.tooltip=Mix measures (Left + Right) / 2. Mono keeps its level; opposite-phase channels cancel.
easyknack.analysis.level.window.tooltip=Trailing RMS window. At startup only the samples received so far are measured. Changing the window or channel resets the measurement history.
easyknack.analysis.level.attack.tooltip=Response time for increasing levels. 0 means immediate. One time constant reaches about 63% of a level step.
easyknack.analysis.level.release.tooltip=Response time for decreasing levels. 0 means immediate. Applied independently to Peak and RMS after block measurement.

