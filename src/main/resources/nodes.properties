spectral.scale.help=Linear: moments over Hz. Logarithmic: moments over log2(frequency), excluding DC. Centroid is returned in Hz; Spread in octaves. Skewness and Kurtosis use the selected scale. Flux, Roll-off, Slope and Flatness are unchanged; Slope remains per Hz.

easyknack.audio.digitalnoise.distribution=Distribution
