digitalnoise.factor.help=Random factor held for one self-modulated cycle. Time-weighted deviations are symmetric in octaves. Strength 1 spans 0.5x to 2x; this does not fix the arithmetic mean frequency or linear spectral centroid.
digitalnoise.strength.help=Maximum deviation in octaves: 0 = factor 1; 1 = 0.5x to 2x. Gaussian uses a standard deviation of Strength / 3, truncated at ±Strength. Distribution is compensated for each cycle's duration.

