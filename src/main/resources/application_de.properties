# Shared application and node text. Keys are stable source-text fingerprints.
text.bea6b42221c291e4=-1 = automatischer Startwert je logischem Node, gemeinsam für Kanal- und Instanzkopien. Für unabhängigen Zufall Context Channel oder Instance Index/Seed verbinden. Ein neuer Startwert startet den Zufallszyklus neu.
text.1394a80bf7ab70ff=-1 = automatischer Startwert je logischem Node. Kanal- und Instanzkopien teilen ihn. Für unabhängiges Rauschen Context Channel oder Instance Index/Seed verbinden. Ein neuer Startwert startet die Folge neu.
text.fe189f1e9684d390=0 = losgelassen, 1 = gehalten (einschließlich Haltepedal). Mit dem Gate der Hüllkurve verbinden.
text.d3c8a90796d548c8=1 = monophon mit Vorrang der letzten Note. 2–32 = getrennte Stimmen; bei voller Belegung wird die älteste gehaltene Stimme ersetzt. Nach den Hüllkurven mit Voice Merge zusammenführen.
text.77f598341e80de79=1, solange die Frequenz positiv und endlich ist und die Konfidenz den Schwellwert erreicht; sonst 0. Numerisches Gate, kein Trigger.
text.e844ae5b1d45d962=1: normale Geschwindigkeit; 0: Position halten; negativ: rückwärts. Dieser Leser bestimmt den Abspieltakt. Leseposition mit einem Positionsleser verbinden.
text.6a56d91a4e8931a4=2x ergänzt das Fenster für lineare Autokorrelation mit Nullen. Das Spektrum wird interpoliert, die Frequenzauflösung jedoch nicht erhöht. Zur Tonhöhenerkennung Rechteckfenster und 2x verwenden.
text.04ab9dbd06b0108c=Ein Übergang wechselt zwischen Wert > Schwellwert und Wert <= Schwellwert. Steigend, fallend oder beides wählen. Auto folgt der Eingangsrate.
text.ebb9b0e558a4d6c9=Eine Monoquelle erscheint an beiden Ausgängen. Stimmengruppen bleiben erhalten.
text.b981b76d054681ae=Ein Anstieg über 0 startet Anstieg und Abfall. Mit aktiviertem Halten wird bei positivem Wert das Halteniveau gehalten. Die Rückkehr zu 0 startet das Ausklingen.
text.f7ff1178af202f6f=Abbrechen
text.b9ff0273a0532ac3=Absolute Pufferposition: 0–1, mit Umlauf an den Enden. Kein eigener Takt. Die Leseposition eines Buffer Readers mit demselben Puffer verbinden; auch später angeschlossen bleibt der Leser synchron.
text.175655e419dbf2b6=Akzeptiert Audio- und Controlwerte. Liest den ganzen Block ohne Glättung.
text.67c4348aa11ab076=Aktive Instanzen, begrenzt durch die maximale Instanzzahl in den Gruppeneinstellungen. Fester Controleingang; keine interne Verdrahtung erforderlich.
text.154a2f52ee57b883=Tatsächliche Position im Ringpuffer, 0–1, einschließlich Versatz. Kann einen weiteren Positionsleser steuern.
text.fb4dce8401727fc7=Tatsächliche Samples je Kanal im aktuellen DSP-Block, höchstens 256. Der letzte Block kann kürzer sein. Dies ist nicht die gesamte Routinglatenz.
text.194f80058669186b=Tatsächliche Ringpufferposition, 0–1 (1 entspricht 0), einschließlich Versatz. Mit dem Positionseingang eines Positionslesers am selben Puffer verbinden, um samplegenau synchron zu bleiben.
text.29af76d38bfeedd4=Combobox hinzufügen
text.dd3db6ac0dfbcfbb=Eintrag hinzufügen
text.baa217911d7da085=Kategorie im Hinzufügen-Menü
text.f107a31266be1ef9=Addieren summiert alle Stimmen. Mittelwert teilt durch die eingestellte Stimmenzahl, einschließlich stiller und losgelassener Stimmen. Mono wird unverändert durchgereicht.
text.88cec84a4c1711af=Alle polyphonen Audiostimmen werden vor der Analyse summiert.
text.5508ac6324944692=Alle erhält Stereo und Polyphonie für IFFT. Mix analysiert (Links + Rechts) / 2. Mono behält seinen Pegel; gegenphasige Kanäle löschen sich aus. Polyphone Stimmen werden summiert.
