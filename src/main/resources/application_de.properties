text.a6d6105cf99c1b52=Ansicht
text.11df30f282ed8157=Ansicht zurücksetzen
text.9cb912cfec0be376=Eine Vorlage in Gruppen-IO einem Eingang zuweisen.
text.5372d39df920a1d3=Eintrag übernehmen
text.8782156b5821f8c6=Wird unter diesem Schwellwert scharfgeschaltet und erfasst beim anschließenden Überschreiten der oberen Schwelle. Ohne Übergang erfolgt eine automatische Erfassung.
text.4ecd688216acb5b0=Indizes 0, 1, … zuweisen
text.bc1b88907d3b748a=Audio
text.90975faa044821a2=Audio gestoppt · Audio → Start · Parameter im Inspector bearbeiten
text.fee16c752d1b1e20=Audio wird in einem internen Puffer gesammelt. Alle erhält Stereokanäle und Stimmen; Links, Rechts und Mix summieren Stimmen.
text.82e723278e9732c0=Audio- oder Controlwert, der nach Abschluss des aktuellen Blocks gespeichert wird. Unabhängiger Zustand je Kanal und Stimme.
text.9600679090981b01=Audio oder Control. Feedback unterstützt Math, Mix, Gain, Einheitenumrechner und Filter. Blockbasierte Prozessoren benötigen eine Blockverzögerung.
text.f4d1e48c718f8956=Auswahl aufheben
text.c601bfd0dcfb72f6=Auto folgt der eingehenden Analyse: Spektrum oder Autokorrelation. Nicht unterstützte Ansichten verwenden die Standardansicht der Quelle.
text.ea5f34c33db7a2e9=Zurück zu den Nodes (Esc)
text.6a3d4a29a1a80e58=Baken
text.5a44cf118d993a4a=Grundfrequenz multipliziert mit dem Faktor dieses Samples, in Hz. Direkt mit dem Frequenzeingang eines Oszillators verbinden.
text.5d9479063bca9053=Grundfrequenz. Der aktuell gehaltene Zufallsfaktor bestimmt 
text.84e45ee7341134db=Bearbeiten
text.60935a92d7da7cd1=Beenden
text.1e20e454d20640fe=Pufferdauer (Sekunden, Millisekunden oder Samples bei der DSP-Samplerate). Minimum: ein DSP-Block (256 Samples). Größenänderungen reservieren außerhalb des Audiothreads einen neuen leeren Puffer und setzen die Leser zurück.
text.21537ef60c9e6629=Ein unter Editoren definiertes Modell wählen. Seine Werte folgen den internen Verbindungen.
text.57039d8ffb9efb47=Führt Stimmen zu einem Signal je Kanal zusammen. Stereopositionen bleiben erhalten; folgende Effekte laufen einmal je Kanal.
text.5e83503a3be80104=Kompensiert die zeitliche Phase bei konstanter Bin-Verschiebung. Schnelle Modulation kann weiterhin Artefakte erzeugen.
text.958395df1ba80a29=Diese bearbeitbare Gruppe kompilieren. Der Hostwechsel unterbricht Audio kurz. 
text.fc027f1ba7f4917f=Vollständiger spektraler Audiostream für IFFT. Keine Frames werden verworfen; Stereokanäle und Stimmen bleiben unabhängig.
text.7584d6c61fcc7eee=Komplexes Spektrum für Analyse, Bin-Verarbeitung und IFFT. Jedes Frame behält seine ursprüngliche Sampleposition.
text.98aa2ccaa3fb1476=Berechnet die IFFT des quadrierten komplexen Betrags im Analyse-Worker. Auf Verzögerung null normiert; Stille ergibt null. 2x FFT-Padding ergibt lineare, ohne Padding zirkuläre Korrelation. Fensterung und Gleichanteilentfernung folgen der FFT.
text.b454f062cf77d3f2=Konfidenz: --
text.73e5ed61cd36d1ba=C++-Compiler konfigurieren …
text.1f11fd03ac4ca2f2=Mit dem Eingang der Spektralgruppe verbinden. Liest Bins aus diesem Spektrum; unverbunden ist die Ausgabe null.
text.f60dccc53696c150=Das Stimmensignal nach der Hüllkurve verbinden. Ausgänge summieren Stimmen ebenfalls automatisch; Merge erlaubt die Wahl der Mischung und Stereoverteilung.
text.97002f43f29a7fae=Verbundener Editor
text.9d4beb6133aad286=Control: jeden tatsächlichen DSP-Block auf einen gehaltenen Wert reduzieren. Audio: jedes Sample erhalten. Trigger werden mit eigenen Nodes umgewandelt.
text.5eee211329d0c290=Wandelt Trigger in Impulse von einem Sample um. Mehrere Trigger am selben Sample werden addiert; alle anderen Samples sind null.
text.74353f87187d6be9=Überblendung: 0 = A, 1 = B. Linear verwendet 1−Faktor und Faktor; gleiche Leistung verwendet Kosinus und Sinus. Der Faktor wird auf 0–1 begrenzt.
text.c3c5d33b929d04bb=Aktuell berechneter Kanal: −1 = links, +1 = rechts. Kanalabhängige folgende Nodes laufen getrennt je Seite. Ein Kontextwert, kein Pan-Regler.
text.e76f5792fdaa236f=DSP-Samplerate in Hz, derzeit 48000. Die interne Verarbeitungsrate, nicht die Rate eines externen Geräts.
text.e9028a569297f9f3=Datei
text.713b25b933c9eebb=Standard: an
text.e00c6e83d7fd8dc6=Verzögerungszeit, einmal pro Block gelesen. Feedback verwendet mindestens ein Sample und wählt die Verarbeitungsschrittweite automatisch. Zeitmodulation muss außerhalb der Feedbackschleife entstehen.
text.5237deeac8f2e20c=Verzögert Noten und Controllerereignisse gemeinsam. Änderungen gelten für neue Ereignisse; wartende behalten ihren Zeitpunkt. Panic leert die Warteschlange sofort.
text.08a75feab0221962=Erkannt: 
text.6aea6afad746f2e9=Erkannt: --
text.05be03d9c7a4e744=Unterschiedliche Zufallswerte für jedes Frequenzbin. Ausgeschaltet teilen alle Bins denselben Wert.
text.df4af7ed4bf3ca76=Bake deaktivieren
text.6a876b140a0ed839=Dokument schließen
text.5227151aade948d7=EASYKNACK  /  Audiograph
text.548cae774b67c067=Jeder Trigger startet die Hüllkurve neu, auch bei gehaltenem Gate. Unverbunden: zum Auslösen klicken.
text.936a161c39314b05=Editor
text.dd73f0753a39817a=An: jedes Frame im Audiopfad berechnen. Aus: Hintergrundanalyse kann verspätete oder fehlende Frames liefern; IFFT bleibt erlaubt, kann aber Lücken oder Artefakte erzeugen.
text.3db31ca98786455b=Eine ganze Zahl von 1 bis 256 eingeben.
text.7cb76b4af12abb80=Einträge
text.56f20a869a498e68=Geschätzte Grundfrequenz in Hz; 0 ohne periodisches Signal. Aktualisierung alle 4096 Samples (85 ms bei 48 kHz).
text.343212f2e0df1ab9=Geschätzte Grundfrequenz in Hz; null ohne periodisches Maximum. Zwischen Analyseframes gehalten.
text.54379b3d5f9f79ad=Einmal je Bin innerhalb einer Spektralgruppe berechnet. Betrag verwendet rohe FFT-Koeffizienten, Phase verwendet Radiant. Ein Bin-Vektor, kein zeitliches Audiosignal.
text.4755e1a2d8bc0fe3=Exponentielle Abfallzeitkonstante. Der erste gültige Eingang initialisiert direkt; Graphänderungen erhalten den Wert. Control aktualisiert einmal pro Block mit dessen verstrichener Dauer.
text.e41597accb20d5c2=Exponentielle Anstiegszeitkonstante: nach dieser Zeit sind 63 % eines Sprungs erreicht, nach dreifacher Zeit etwa 95 %. Null folgt sofort. Audio glättet Controlsprünge sampleweise.
text.b4361d32eeeaa393=Gruppe als Plugin exportieren …
text.c36038a0a86d8b9c=Zusätzlicher Abstand über die Mitte hinaus vor einem Notenwechsel. Standard: 0,1 Halbton (10 Cent). Null wählt sofort die nächste Note. Gilt nur im Skalenmodus.
text.931ef210515e7941=Die Latenz von FFT zu IFFT entspricht dieser Samplezahl. Eine Größenänderung setzt den Stream zurück.
text.56b32f45c6febc1e=Ersatzwert bis zur ersten gültigen Frequenz. Danach aktualisieren nur akzeptierte Messungen den gehaltenen Wert.
text.351fd558e43d93ff=Erstes/Letztes: ein Sample. Mittelwert: vorzeichenbehaftetes Mittel. RMS: Wurzel des quadratischen Mittels. Minimum/Maximum: vorzeichenbehaftete Extremwerte. Absolutes Maximum: größter Betrag, nie negativ. Nutzt die tatsächliche Blocklänge (bis 256 Samples); der Mittelwert bipolarer Wellen kann null sein.
text.ca7aafa066c8dbff=Neuaufbau erzwingen
text.45a0043937ba924d=Anteil der Pufferlänge hinter dem Lesekopf: 0 und 1 sind identisch; 0,5 liegt auf halbem Umlauf. Lesen läuft um; unbeschriebene Bereiche sind still. Keine automatische Überblendung.
text.5f448935bbd1ed85=Von Position abgezogener Pufferanteil. 0,5 für einen zweiten Kopf auf halbem Umlauf. Keine automatische Überblendung; unbeschriebene Samples sind still.
text.7ee9d69ab3491619=Frequenz aus derselben MIDI-Noten-Stimmengruppe: C4 ist die Mitte, C2 links, C6 rechts. Unverbunden bleiben Stimmen mittig.
text.0834b69ff26dd6b6=Frequenz des gewählten Bins in Hz.
text.88bec14b811ffa74=Geräte und Anwendungen aktualisieren
text.6a171774b3ff26af=Letzte akzeptierte Frequenz halten, solange die Konfidenz unter der Schwelle liegt oder die Frequenz null/nicht endlich ist. Kein automatisches Fading und keine Glättung.
text.f6e95b35f5ddeb9d=Eingangseinheit: 
text.91362604c48cff42=Einfügen: Eingang
text.da706aff07b4eda8=Einfügen: Ausgang
text.7b60a14d6de73af4=Innerhalb einer Spektralgruppe: liest das ursprüngliche Eingangsspektrum an einem gebrochenen Bin-Index. Nachbarn können unabhängig von der Berechnungsreihenfolge kombiniert werden.
text.10e9a9dc876f321f=Quellcode-Plugin installieren …
text.ac2e048daf767172=Instanzgruppen-Kontext: nullbasierter Instanzindex, aktive Anzahl, normierte Position (0 bei einer Instanz) und stabiler Startwert je Instanz.
text.e9ee040ab1e91fb7=Instanzmischung
text.de1c279063687751=Den lautesten Anteil der nichtnegativen FFT-Bins behalten, einschließlich Gleichanteil und Nyquist. Anzahl wird auf die nächste ganze Zahl gerundet. 0 löscht alle, 1 ändert nichts. Rangfolge nach einseitiger Amplitude; bei Gleichstand haben niedrigere Indizes Vorrang. Erhaltene Koeffizienten und Phasen bleiben unverändert, ohne Pegelnormierung. Je FFT-Frame mit dem aktuellen Blockwert angewendet.
text.2dfc73155f33859b=Tastaturtransposition: 12 Halbtöne = eine Oktave. A spielt bei null C4.
text.2f6aa0d5c79cdddf=Linker Eingangskanal als Monosignal, identisch auf beiden Kanälen.
text.11a663db7c162938=Linear erhält den Pegel identischer Signale. Gleiche Leistung erhält die erwartete Leistung unkorrelierter Signale; identische Signale können in der Mitte etwa 3 dB gewinnen.
text.afb7410b2c9b6c49=Logarithmische Leistungsverteilung von Frequenz / Faktor bis Frequenz × Faktor. Faktor 2 umfasst je eine Oktave. Verbundene Werte über 1 sind ohne obere Slidergrenze erlaubt. Werte unter 1 gelten als 1; Gleichanteil bleibt unverändert. Diskrete Bin-Mitten bestimmen die möglichen Ziele.
text.de63c6d4b36e5c1a=Logarithmischer Radius in Oktaven. 0 ändert nichts; 1 verteilt von halber bis doppelter Frequenz. Verbundene Werte über 1 werden unterstützt. Negative Werte gelten als 0. Gleichanteil bleibt unverändert.
text.9cf91628164bfbe0=Logarithmische Variation. 
text.6e193d1c0f5877e9=MIDI-CC-Nummer: 1 = Modulationsrad, 7 = Lautstärke, 64 = Haltepedal. Den Ausgang 0–1 auf den gewünschten Parameterbereich abbilden.
text.8a0d26a2a4ef9184=MIDI-Control-Change-Wert, von 0–127 auf 0–1 normiert. Hält den zuletzt empfangenen Wert.
text.5e6780fa14e69d28=MIDI-Ereignisse mit Samplepositionen.
text.e4630f2d7e76ef2a=Betrag: einseitige Amplitude. Phase: Radiant relativ zum Fensteranfang. Leistung: quadrierte Amplitude, keine spektrale Leistungsdichte.
text.b097752c1d4a43de=Maximum (leer = unbegrenzt)
text.23d7dcf0d66c258f=Maximale Instanzen (1–256)
text.361fed23291e2041=Minimum (leer = unbegrenzt)
text.e84a0b54af3e173f=Mix zeigt (Links + Rechts) / 2. Mono behält seinen Pegel; gegenphasige Kanäle löschen sich aus.
text.58cef28728819dde=Gemischte Stimmen. Folgende Effekte laufen einmal je Kanal. Summe kann ±1 überschreiten; Mittelwert teilt durch die eingestellte Stimmenzahl, einschließlich losgelassener Stimmen.
text.5e2c614c23f02239=Modell
text.40bb50da160cdc21=Nach unten
text.c66feb5eb8f217c7=Nach oben
text.cc09a233f00a11f2=Mute-Durchleitung: Eingang
text.00d7f8ea010b25ee=Mute-Durchleitung: Ausgang
text.fa88063a4854853d=Neue Zufallswerte für jedes FFT-Fenster, nicht jeden Audioblock. Ausgeschaltet bleiben die Werte zeitlich konstant.
text.7673fe59c4c652ce=Nodetyp (Titelfarbe)
text.7ac362063b9f2046=Nodes
text.ffa2baa9c70626ba=Nichtnegatives Gewicht je Instanz. Summe addiert gewichtete Signale; Mittelwert teilt durch die aktive Anzahl; gewichteter Mittelwert durch das Gesamtgewicht. Bei Gewichtssumme null entsteht Stille.
text.2c9e831acd1cba5a=Ungleich null verwirft dieses Bin. Vor den übrigen Berechnungen einmal je FFT-Frame ausgewertet. Einen Vergleich der Bin-Kontext-Amplitude verbinden. Audioabhängige Bedingungen sind nicht erlaubt.
text.4c6ce6449380a8db=Normierte Korrelation bei der erkannten Periode, 0–1. Fensterung und kurze Fenster verringern die Konfidenz; Oktavmehrdeutigkeiten sind möglich.
text.5a1abc063e842415=Normierte Korrelation bei der erkannten Periode: 0–1. Obertonmischungen können Oktavmehrdeutigkeiten erzeugen.
text.e676086bb63f3bc5=Nicht gebaken
text.c68ed7471fd84419=Notenfrequenz in Hz, einschließlich Transposition und Pitchbend. A4 = 440 Hz.
text.0c29795e9cd15c1c=Anschlagstärke, von MIDI 1–127 auf 0–1 normiert; 0 nach dem Loslassen.
text.565339bc4d33d728=OK
text.df70dd3b80768ac4=Ein samplegenauer Trigger je neuer Note. Startet die Hüllkurve auch bei gehaltenem Gate neu.
text.84f0b1d5fd5d9c23=Ein Trigger je gewähltem Schwellwertübergang. Audio wird je Sample, Control bei Blockaktualisierungen geprüft. Der erste Wert initialisiert ohne Trigger.
text.35c3461861131ce3=Impuls von einem Sample bei jedem neuen Zufallsfaktor.
text.81c1234d8570eafc=Vergrößerten Graphen öffnen
text.d1fba262ebf77e03=Plugin-Quellcode öffnen
text.843a7d63f4109d05=Renderdiagnose öffnen
text.399159510baec04c=Parallele Bins (automatisch)
text.17937473887af93c=Je Analyseframe: alt × (1 − Faktor) + neu × Faktor. 1 = sofort, 0 = erstes Frame halten. Kleinere Werte glätten stärker. Initialisiert mit dem ersten Frame; FFT- oder Normierungsänderungen setzen zurück. Overlap bestimmt die Aktualisierungsrate.
text.36cc824f4c10b605=Phasenversatz; eine Umdrehung ist ein ganzer Zyklus. Wird zur laufenden Oszillatorphase addiert, ohne sie zurückzusetzen.
text.365a1e1c962ddf50=Tonhöhenversatz: 1 st = ein Halbton, 2 st = ein Ganzton, 0,01 st = ein Cent. Gilt für neue Noten; gebrochene Stimmung bleibt intern erhalten.
text.db056ea6cfed1a0e=Plugin-Installation / Build
text.9514b7ff4860ead7=Plugins
text.a52c30c7e1f48f78=Positive Verschiebungen bewegen Bins nach oben. Ein Bin = Samplerate / FFT-Größe Hz. Gebrochene Werte interpolieren komplexe Bins; Energie außerhalb des Bereichs wird verworfen. Dies ist Frequenzverschiebung, keine musikalische Transposition.
text.8554aaff8adcca37=Vorheriger DSP-Block. Startet mit Stille. Ein Block umfasst 256 Samples (5,33 ms bei 48 kHz). Unterbricht Feedbackzyklen.
text.3392bdce5994acd5=Vorheriges Sample. Startet mit Stille. Ein Sample dauert 20,83 Mikrosekunden bei 48 kHz. Nur die Feedbackschleife läuft sampleweise.
text.2f72b38e2e5bd3fc=Quantisiert positive Hz auf die nächste erlaubte gleichstufige Note in Halbtönen. Bei Gleichstand wird die tiefere Note gewählt. Ungültige Eingänge/null ergeben im Skalenmodus null. Bei unzuverlässiger Erkennung Pitch Hold vorschalten.
text.698c6ebfdc1287db=Radius in Bins, auf ganze Bins gerundet. Verteilt die Leistung gleichmäßig auf Nachbarn und erhält die spektrale Gesamtleistung einschließlich Gleichanteil/Nyquist. Null ist eine exakte Durchleitung. Zielphasen bleiben erhalten; Bin Random separat zur Phasenzufälligkeit verwenden. Je FFT-Frame mit dem aktuellen Blockwert angewendet.
text.fc09a3e7a51e55ed=Zufälliger Multiplikationsfaktor, für einen selbstmodulierten Zyklus gehalten. 
text.45b63ffd01af7b9c=Rate
text.8b99e6d665bd1ffd=Plugins neu bauen
text.4ac8848701e06995=Rekonstruiert Spektrumframes mit normierter überlappender Addition. Synchrone Latenz: ein Fenster. Asynchrone FFT ist erlaubt, verspätete oder fehlende Frames können jedoch Lücken oder Artefakte erzeugen.
text.a0b7e6a0d83ccb44=Reduziert gewählte Spektralbins auf einen Wert. Maximum ist der größte Betrag; RMS ist der RMS der Bins, nicht des Audios. Integral ist die Binsumme multipliziert mit dem Frequenzabstand in Hz. Bis zum nächsten Analyseframe gehalten.
text.226164974f3c3d17=Gruppe neu erzeugen und kompilieren, ohne einen Build aus dem Cache zu verwenden. Der Hostwechsel unterbricht Audio kurz.
text.d653a1c5faf28206=Eintrag entfernen
text.49cf74143798e461=Vorlage entfernen
text.91f36a2250b203a9=Vorlage umbenennen
text.765cabdc59632813=Reservierte Instanzkapazität. Die aktive Anzahl wird am Gruppennode gesteuert. Speicher wird außerhalb des Audiothreads vorbereitet.
text.c05a5455d3ac5e9f=Alle Teiltöne vor diesem Sample zurücksetzen; Phase wird danach einmal angewendet. Unverbunden: klicken setzt beim nächsten Block zurück.
text.c0be7335782365bb=Laufende Phase vor diesem Sample zurücksetzen; Phase wird danach einmal angewendet. Unverbunden: klicken setzt beim nächsten Block zurück.
text.374345f2e32f0188=Auf Automatik zurücksetzen
text.98b9d3fc671c8b01=Auf die Schreibposition dieses Samples zurücksetzen, dann Versatz anwenden. Unverbunden: klicken setzt beim nächsten Block zurück.
text.1496e31da69da1bc=Wiederverwendbare Editorvorlagen
text.4014ce798697adf9=Rechter Eingangskanal als Monosignal, identisch auf beiden Kanälen.
text.4e2b3e6e20e6afda=Samples je FFT-Fenster. Größere Fenster verbessern die Frequenztrennung, umfassen aber einen längeren Zeitraum. Änderungen setzen die Analyse zurück.
text.6d8a30061944ad82=Ein Ereignis beim nächsten Audioblock senden. Mit mehreren Reset-Eingängen verbinden, um sie am selben Sample zurückzusetzen.
text.ae188faa0901919f=Als Standard setzen
text.21a2b9ac2263db85=Gemeinsamer Schnappschuss von 8192 Samples. Alle 4096 Samples im Hintergrund aktualisiert; Ergebnisse treffen asynchron ein.
text.a17035fd78811b47=Gemeinsame Autokorrelationskurve für den Analysebetrachter. Bestehende Frequenz- und Konfidenzausgänge behalten ihre Positionen.
text.6c0245695ac661ae=Gemeinsames Signal: Nodes nach diesem Ausgang laufen einmal, nachdem alle Instanzen zusammengeführt wurden.
text.ca6845af85a6948d=Kürzester Ringabstand zum samplegenauen Schreibkopf: 0 am Schreibkopf, 1 auf halbem Umlauf. Einschließlich Versatz. Jedes Sample sieht seinen und frühere Schreibvorgänge, niemals spätere im Block.
text.0704117ffd0cca69=Kürzester Abstand zum Schreibkopf: 0 am Kopf, 1 auf halbem Umlauf. Einschließlich Versatz; als Überblendgewicht geeignet.
text.698d6d6e8e21eb1c=Signal für den linken Ausgang. Eine Stereoquelle liefert ihren linken Kanal.
text.c625edb1fcc32bb5=Signal für den rechten Ausgang. Eine Stereoquelle liefert ihren rechten Kanal. Unverbundene Eingänge sind still.
text.fb86475ed236d30b=Einseitige Amplitude, normiert durch die Summe des Analysefensters. Als Gewicht eines additiven Oszillators geeignet; Betrag erhält rohe FFT-Koeffizienten.
text.2e93bd529d40b451=Bins mit exakt null als Eingangskoeffizient vor Discard und Bin-Verarbeitung überspringen. Beim Erzeugen von Bins oder Lesen anderer Bins ausschalten. Gilt auch nach Spectrum Prune.
text.9df958c72c80d588=Leere Eingangs-Bins überspringen
text.f6b2ff39f540eb81=Speichern
text.e4bb9f1ece9af926=Start
text.b5f173da9b84a2e9=Statistik verwendet die gewählte Ansicht. Frequenz in Hz, Periodizität 0–1; Korrelationszeit integriert positive normierte Verzögerungen bis zum ersten Nulldurchgang (Sekunden). Ergebnisse sind asynchron und werden bis zum nächsten Schnappschuss gehalten.
text.cae7d57bc067a514=Stopp
text.6015ee3865447c18=Mittelwert des Eingangsfensters vor der Fensterung abziehen. Für das frühere gleichanteilfreie Autokorrelationsverhalten aktivieren.
text.30eaddeafeaeb4b6=Ziel: 
text.a2763a5bcbcd5856=Ziel: --
text.7b905ed0eaf2ffb0=Vorlagenname
text.63e214551271baca=Unverzerrt kompensiert die geringere Sampleüberlappung bei großen Verzögerungen in linearer Korrelation; Werte sind wie im alten Node auf ±1 begrenzt. Für altes Verhalten Rechteckfenster, 2x Padding und Gleichanteil entfernen verwenden. Zirkuläre Korrelation hat konstante Überlappung. Die Fensterabschwächung wird nicht rückgängig gemacht.
text.c190594de8c989ef=Ungespeicherte Änderungen speichern?
text.b6cc7b5fde959e7b=Gleichverteilter Zufallswert von 0 (einschließlich) bis 1 (ausschließlich) je Bin. Gleicher Startwert, Bin und Frame erzeugen denselben Wert, auch kanalübergreifend.
text.8c689c17cec35a23=Einheiten (gespeichert: 
text.7d295de884617382=Rechteckfenster mit 2x Nullauffüllung und mehreren Perioden der niedrigsten erwarteten Frequenz verwenden. Minimum muss kleiner als Maximum sein.
text.622bfb79b1731621=Einen gemeinsamen Worker für ausreichend große unabhängige FFT-Bin-Programme verwenden. Kleine Programme und Audiostimmen je Bin bleiben seriell; bei belegtem Worker wird seriell gerechnet.
text.2e3eeb0e6a0e81c1=Nur im festen Modus verwendet. Der Skalenmodus verwendet stattdessen Grundton und Skala.
text.8e37953d23daca5f=Wert
text.9d7e5880854d4f15=Vergrößern
text.34283cf0f2dfde44=Verkleinern
text.594ca889c4421b84=Verwerfen
text.ed3894c20ea5358a=Sichtbarer vertikaler Bereich: minus bis plus dieser Wert. Ändert nur die Darstellung, nicht das Signal oder die Analyse.
text.44f52d7861050b15=Stimmensignal nach der Hüllkurve. Pan vor Merge positioniert einzelne Stimmen, danach die gesamte Mischung.
text.2c8c6ae1272e3689=Vorwärts
text.d95138b003cb9982=Warte auf Audio
text.8cb7684e6a8dbfb3=Fensterüberlappung: 0–1 (oder Prozent). Auf einen ganzzahligen Sampleabstand gerundet, mindestens ein Sample. Aktueller Hop: 
text.548611ce58f71a17=Zurück
text.6b19081b78405322=−1 = links, 0 = Mitte, +1 = rechts. Pan mit gleicher Leistung für Mono, Balance für Stereo. Vor Merge: je Stimme. Nach Merge: gesamte Mischung.

