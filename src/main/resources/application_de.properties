text.8a716159a6854658=Kernel

text.e906b70fad6e47e1=Kernelradius in Bins. Null reicht exakt unverändert durch. Gauß verwendet einen Radius von drei Standardabweichungen. Die Phasen der Zielbins bleiben erhalten; Phasenrandomisierung ist eine separate Operation.

text.e8260b6010484eec=Skaliert jeden Frame auf die ursprüngliche spektrale Gesamtleistung. Dies ist keine Normierung der wahrgenommenen Lautheit. Ohne Normierung übernimmt Maximum den höchsten Nachbarwert; Box und Gauß mitteln Amplituden.

text.a6ed9ed152cdcbf4=Kernelradius in Bins. Null reicht exakt unverändert durch. Gauß verwendet einen Radius von drei Standardabweichungen. Phase beibehalten wählt reine Magnitudenbearbeitung.

text.1237e268115650a5=Aus: Die Phase jedes Bins läuft für die IFFT-Synthese kontinuierlich mit seiner Bin-Frequenz weiter. An: Eingangsphasen für reine Magnitudenbearbeitung beibehalten; neu gefüllte Bins können sich beim Überlappen auslöschen. Breite null erhält immer den vollständigen Eingang.

text.f10c62555230508b=Phase beibehalten

text.25dfadc00885f419=Beibehalten

text.c5af3d2bf8edf1fd=Noise füllt Frequenzbereiche mit einer zusammenhängenden Rauschquelle. Continuous erzeugt Töne auf Bin-Mitten. Preserve verändert nur Magnituden; bei IFFT-Überlappung sind Auslöschungen möglich. Breite null bleibt unverändert.

text.0be53b37180f2dc7=Kernelradius in Bins. Null bleibt unverändert. Gaussian verwendet drei Standardabweichungen als Radius. Synthese wählt Rauschen, Töne oder reine Magnitudenbearbeitung.

text.04f13cecbc50590b=Kontinuierlich

text.7de5a138fd9bbeda=Synthese

text.04bdfa9bf8a69a22=Erhält die spektrale Gesamtleistung; im Rauschmodus als Erwartungswert, nicht als Begrenzer pro Frame. Keine Normalisierung der wahrgenommenen Lautheit.

text.fe574b9cb60aa36c=Gleicht kurze Lautstärkeschwankungen nach dem Overlap-Add aus. 0 lässt das Signal unverändert; 1 nutzt den vollen begrenzten RMS-Ausgleich (10 ms / 500 ms). Kann gewollte Dynamik abschwächen und das Spektrum leicht verbreitern. Keine zusätzliche Latenz.

text.1e42d0c86af7a9c6=Stabilität

text.27b0a304e7c8ce54=Übernimmt das nächste vollständige FFT-Fenster getrennt pro Bin und Kanal. Vor der Aufnahme werden Werte durchgereicht. Das Halten der Magnitude behält die eingehende Phase bei und ist kein unabhängiger Spectral Freeze.

text.54460556c5cd94ee=Fenster-Trigger

text.3f90835b38c2299f=Bin Sample & Hold

text.3338880eef09adda=Eine Spectral-Gruppe benötigt einen Spectrum-Eingang, höchstens einen Spectrum-Ausgang und sieben Audio-Combine-Ausgänge sowie bis zu 16 Zahlen- oder Trigger-Eingänge.

text.c1c1009d3f37ec05=Übernahme

text.b068477b4ffc365b=Pegelausgleich

text.799c7d78c63efb6d=Höhere Ordnungen erzeugen steilere Flanken durch mehrere Stufen zweiter Ordnung. Die Resonanz wird auf die Stufen verteilt. Ordnung 2 erhält den bisherigen Filter.

text.9754f12bccfa20be=Gleicht den geglätteten Ausgangs-RMS an den Eingangs-RMS an, mit Verstärkung von 0,25 bis 4. Keine Lautheitsnormalisierung und kein Limiter; entfernt keine Filterwirkung. Keine zusätzliche Latenz.

text.623efd3744860446=Bin-Speicher

text.1ca99a991188e227=Anteil des neuen Werts pro FFT-Fenster: 0 hält, 1 ersetzt. Das erste Fenster initialisiert jeden Bin. Kleinere Hop-Größen aktualisieren häufiger. Audioeingänge nutzen den Wert am Fensterende.

