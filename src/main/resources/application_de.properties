envelope.hold.tooltip=Sustain halten, solange Gate positiv ist. Ausgeschaltet: nach Attack/Decay direkt mit Release fortfahren.
triggerdivider.trigger.tooltip=Gibt jeden N-ten Trigger an seiner ursprünglichen Sampleposition weiter. Teilung 2 gibt Trigger 2, 4, 6, ... weiter. Unverbunden: Klicken zählt einen Trigger.
triggerdivider.reset.tooltip=Setzt den Zähler ohne Ausgangstrigger zurück. Ein gleichzeitiger Eingangstrigger zählt als erster Trigger nach dem Zurücksetzen.
triggercounter.index.tooltip=Erster Trigger: Index 0, danach 1, 2, ... Bleibt zwischen Triggern konstant und wird am selben Sample wie der Ausgangstrigger aktualisiert. Ohne Wiederholung maximal 16777215 (exakte Float-Ganzzahlen).
triggercounter.reset.tooltip=Setzt den Index ohne Ausgangstrigger auf 0 zurück. Der nächste Trigger hat Index 0. Zurücksetzen erfolgt vor einem gleichzeitigen Trigger.
triggercounter.count.tooltip=Bei aktivierter Wiederholung laufen die Indizes von 0 bis Anzahl minus 1. Ohne Wiederholung wird dieser Wert ignoriert.
triggerfilter.condition.tooltip=Lässt einen Trigger nur durch, wenn die Bedingung genau an diesem Sample endlich und größer als 0 ist. Null und negative Werte verwerfen ihn. Für samplegenaue Indexvergleiche Audiorate verwenden.
triggerpulse.tooltip=Wandelt jeden Trigger in einen Impuls von einem Sample mit Wert 1 um. Gleichzeitige Trigger im selben Strom ergeben einen Impuls; alle anderen Samples sind null.
rate.trigger.tooltip=Trigger: maximal ein Trigger pro Sample und Strom, getrennt pro Stimme. MIDI-Ports übertragen vollständige MIDI-Nachrichten.
triggerdelay.time.tooltip=Verzögerung von 1 Sample bis 10 Sekunden, auf ganze Samples gerundet. Die Zeit wird einmal pro Block gelesen; eingegangene Trigger behalten ihren Fälligkeitszeitpunkt. Bei Feedback muss Zeit von außerhalb der Schleife kommen.
triggerdelay.reset.tooltip=Löscht wartende Trigger einschließlich der an diesem Sample fälligen. Ein gleichzeitiger neuer Eingangstrigger plant einen neuen Trigger. Reset muss von außerhalb der Feedbackschleife kommen.
triggermerge.tooltip=Führt 2 bis 16 Triggerströme zusammen. Gleichzeitige Trigger ergeben einen Ausgangstrigger. Funktioniert in Feedbackschleifen mit Trigger Delay.
triggertimer.elapsed.tooltip=Zeit seit dem letzten Trigger in der gewählten Einheit. Bis zum ersten Trigger null, danach sampleweise ansteigend. Jeder Trigger setzt den Wert auf null. Wird nicht geglättet.
triggertimer.interval.tooltip=Zeit zwischen den letzten beiden Triggern, optional geglättet, in der gewählten Einheit. Bis zum zweiten Trigger null. Bleibt bis zum nächsten Trigger konstant; das erste gemessene Intervall wird sofort übernommen.
triggertimer.smoothing.tooltip=Wird bei jedem Trigger gelesen. 0: neues Intervall direkt übernehmen. 0,9: 90% bisheriges plus 10% neues Intervall. 1: gemessenes Intervall halten. Das erste vollständige Intervall wird immer direkt übernommen.
