easyknack.analysis.level.peak.tooltip=Absoluter Spitzenwert des aktuellen Blocks. Lineare Amplitude: 0 = Stille, 1 = Vollaussteuerung; Werte über 1 sind erlaubt. Optionale Glättung folgt den Blockspitzen.
easyknack.analysis.level.rms.tooltip=Quadratischer Mittelwert über das zurückliegende Zeitfenster. Lineare Amplitude, einmal pro Block aktualisiert. Ein voll ausgesteuerter Sinus hat RMS etwa 0,707. Keine Frequenzgewichtung.
easyknack.analysis.level.audio-in.tooltip=Polyphone Stimmen werden vor der Messung summiert. Ohne Verbindung wird Stille gemessen.
easyknack.analysis.level.channel.tooltip=Mix misst (Links + Rechts) / 2. Mono behält seinen Pegel; gegenphasige Kanäle löschen sich aus.
easyknack.analysis.level.window.tooltip=Gleitendes RMS-Fenster. Beim Start werden nur bereits empfangene Samples gemessen. Eine Änderung von Fenster oder Kanal setzt den Messverlauf zurück.
easyknack.analysis.level.attack.tooltip=Reaktionszeit für steigende Pegel. 0 reagiert sofort. Nach einer Zeitkonstante sind etwa 63 % eines Pegelsprungs erreicht.
easyknack.analysis.level.release.tooltip=Reaktionszeit für sinkende Pegel. 0 reagiert sofort. Wird nach der Blockmessung getrennt auf Peak und RMS angewendet.

