easyknack.routing.stepswitch.index.tooltip=Aktiver Schrittindex, beginnend bei 0. Folgt der Ausgangsrate.
easyknack.routing.stepswitch.steps.tooltip=Anzahl der Eingänge, 1–32. Wird der aktive Schritt entfernt, beginnt die Auswahl beim ersten Eingang. Rückgängig stellt entfernte Verbindungen wieder her.
easyknack.routing.stepswitch.next.tooltip=Jeder Trigger schaltet einen Schritt weiter, nach dem letzten folgt der erste. Unverbunden: Ein Klick schaltet zum nächsten Block weiter.
easyknack.routing.stepswitch.reset.tooltip=Wählt den ersten Eingang. Zurücksetzen hat bei gleichzeitigem Weiter-Trigger Vorrang.
easyknack.routing.stepswitch.rate.tooltip=Auto verwendet Audiorate bei angeschlossenem Trigger oder Audioeingang, sonst Kontrollrate. Kontrollrate liest am Blockanfang; spätere Trigger wirken im nächsten Block. Direktes Umschalten von Audio kann klicken.
easyknack.routing.stepswitch.select.tooltip=Diesen Schritt zum nächsten Audioblock auswählen.

