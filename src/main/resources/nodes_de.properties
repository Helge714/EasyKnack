easyknack.analysis.correlationfeatures.periodicity.tooltip=Normierter positiver Autokorrelationspeak von 0–1. Misst die Wiederholungsstärke, keine Wahrscheinlichkeit oder wahrgenommene Tonhöhe.
easyknack.analysis.correlationfeatures.hnr.tooltip=Geschätztes Verhältnis periodischer Anteile zu Rauschen: 10 log10(p / (1 − p)), auf −120…120 dB begrenzt. Hängt von Fensterung und Korrelationsnormierung ab; kein unabhängiger Messwert.
easyknack.analysis.correlationfeatures.valid.tooltip=1, wenn ein positiver lokaler Peak im Suchbereich die Periodizitäts- und Stille-Schwellen erfüllt. Sonst sind Periode und Frequenz null.
easyknack.analysis.correlationfeatures.silence.tooltip=Minimaler fenstergewichteter Quell-RMS als lineare Amplitude. Mindestens drei Perioden pro Fenster nötig. Ausgänge halten zwischen Frames; ungeeignete Ressourcen und Stille setzen sie zurück.

easyknack.analysis.spectralfeatures.frequency-scale=Frequenzskala
spectral.scale.linear=Linear
spectral.scale.logarithmic=Logarithmisch
spectral.scale.help=Linear: Momente über Hz. Logarithmisch: Momente über log2(Frequenz), ohne Gleichanteil. Zentrum wird in Hz ausgegeben, Streuung in Oktaven. Schiefe und Kurtosis nutzen die gewählte Skala. Flux, Roll-off, Steigung und Flachheit bleiben unverändert; Steigung weiterhin pro Hz.

easyknack.audio.digitalnoise.distribution=Verteilung
digitalnoise.distribution.uniform=Gleichverteilt
digitalnoise.distribution.gaussian=Gauß
digitalnoise.factor.help=Zufallsfaktor für eine selbstmodulierte Periode. Zeitlich gewichtete Abweichungen sind in Oktaven symmetrisch. Stärke 1 umfasst 0,5x bis 2x; der arithmetische Frequenzmittelwert und das lineare Spektralzentrum bleiben dadurch nicht fest.
digitalnoise.strength.help=Maximale Abweichung in Oktaven: 0 = Faktor 1; 1 = 0,5x bis 2x. Gauß nutzt Stärke / 3 als Standardabweichung, auf ±Stärke begrenzt. Die Verteilung berücksichtigt die unterschiedliche Periodendauer.

